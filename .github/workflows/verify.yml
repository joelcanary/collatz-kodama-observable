name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  numbers:
    name: every number in the papers, and the figures' internal checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy matplotlib
      - run: python papers/three-exact-results/verify.py
      - run: python papers/althofer-prize3/verify_prize3.py
      - run: python scripts/kodama_scan.py 1000000 2
      - run: python scripts/make_figures.py
      - run: python scripts/render_catalog.py

  lean:
    name: Lean proofs and axiom audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: lake exe cache get
      - run: lake build CollatzProof.AxiomAudit 2>&1 | tee audit.log
      - name: every cited theorem uses only the kernel axioms
        run: |
          grep -c "depends on axioms: \[propext, Classical.choice, Quot.sound\]" audit.log
          ! grep -E "sorryAx|error" audit.log
